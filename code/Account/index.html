<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account</title>
    <link rel="stylesheet" href="/code/Global_styles.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="/code/Header_and_Footer/styles.css" />
    <link rel="stylesheet" href="/code/Preloader/preloader.css" />
  </head>
  <body>
    <div class="account-page">
      <header id="header"></header>

      <main class="main-content">
        <div class="content-wrapper">
          <section class="account-section">
            <h1 class="page-title" data-i18n="account_page_title">Account</h1>
            <div class="account-details">
              <div class="detail-row">
                <div class="detail-info">
                  <label class="detail-label" data-i18n="account_username">Username</label>
                  <p id="username" class="detail-value"></p>
                </div>
                <button class="edit-button"></button>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <label class="detail-label" data-i18n="account_fullname">Fullname</label>
                  <p id="fullname" class="detail-value"></p>
                </div>
                <button class="edit-button"></button>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <label class="detail-label" data-i18n="account_email">Email</label>
                  <p id="email" class="detail-value"></p>
                </div>
                <div class="button-group">
                  <button class="edit-button secondary"></button>
                  <button class="edit-button primary"></button>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <label class="detail-label" data-i18n="account_password">Password</label>
                  <p id="password" type="password" class="detail-value"></p>
                </div>
                <button class="edit-button"></button>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <label class="detail-label" data-i18n="account_phone_number">Phone number</label>
                  <p id="phone-number" class="detail-value"></p>
                </div>
                <button class="edit-button"></button>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <label class="detail-label" data-i18n="account_date_of_birth">Date of birth</label>
                  <p id="date-of-birth" class="detail-value"></p>
                </div>
                <button class="edit-button"></button>
              </div>
            </div>
          </section>
        </div>
      </main>

      <footer id="footer" class="footer"></footer>
    </div>

    <script src="/code/preloader/preloader.js"></script>
    <script type="module" src="/code/Header_and_Footer/header.js"></script>
    <script type="module" src="/code/Header_and_Footer/footer.js"></script>
    <script type="module" src="/code/Header_and_Footer/language-switcher.js"></script>
    <script type="module" src="account.js"></script>
  </body>
</html>
