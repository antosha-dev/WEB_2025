<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add_flight</title>
    <link rel="stylesheet" href="/code/Global_styles.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="/code/Header_and_Footer/styles.css" />
    <link rel="stylesheet" href="/code/Preloader/preloader.css" />
  </head>
  <body>
    <div class="account-page">
      <header id="header"></header>

      <main class="main-content">
        <div class="content-wrapper">
          <section class="account-section">
            <div class="account-details">
              <div class="detail-row">
                <div class="detail-info">
                  <div class="field">
                    <div class="input-container">
                      <input id="airline" type="input" class="input" value="" />
                      <label
                        class="input-label"
                        data-i18n="add_flight_airline_name"
                        >Airline name</label
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <div class="field">
                    <div class="input-container">
                      <input id="rating" type="input" class="input" value="" />
                      <label class="input-label" data-i18n="add_flight_rating"
                        >Rating</label
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <div class="field">
                    <div class="input-container">
                      <input id="reviews" type="input" class="input" value="" />
                      <label class="input-label" data-i18n="add_flight_reviews"
                        >Reviews</label
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <div class="field">
                    <div class="input-container">
                      <input id="price" type="input" class="input" value="" />
                      <label class="input-label" data-i18n="add_flight_price"
                        >Price</label
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <div class="field">
                    <div class="input-container">
                      <input
                        id="departure"
                        type="input"
                        class="input"
                        value=""
                      />
                      <label
                        class="input-label"
                        data-i18n="add_flight_departure"
                        >Departure</label
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <div class="field">
                    <div class="input-container">
                      <input
                        id="arrival"
                        type="input"
                        class="input"
                        value=""
                        data-i18n=""
                      />
                      <label class="input-label" data-i18n="add_flight_arrival"
                        >Arrival</label
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <div class="field">
                    <div class="input-container">
                      <input id="type" type="input" class="input" value="" />
                      <label class="input-label" data-i18n="add_flight_type"
                        >Type</label
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <div class="field">
                    <div class="input-container">
                      <input
                        id="duration"
                        type="input"
                        class="input"
                        value=""
                      />
                      <label class="input-label" data-i18n="add_flight_duration"
                        >Duration</label
                      >
                    </div>
                  </div>
                </div>
              </div>
              <div class="detail-row">
                <div class="detail-info">
                  <div class="field">
                    <div class="input-container">
                      <input id="route" type="input" class="input" value="" />
                      <label class="input-label" data-i18n="add_flight_route"
                        >Route</label
                      >
                    </div>
                  </div>
                </div>
              </div>
              <button id="apply-btn" class="search-button">Add to data base</button>
            </div>
            
          </section>
        </div>
      </main>

      <footer id="footer" class="footer"></footer>
    </div>

    <script src="/code/preloader/preloader.js"></script>
    <script type="module" src="/code/Header_and_Footer/header.js"></script>
    <script type="module" src="/code/Header_and_Footer/footer.js"></script>
    <script
      type="module"
      src="/code/Header_and_Footer/language-switcher.js"
    ></script>
    <script type="module" src="add.js"></script>
  </body>
</html>
