<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="cart_titlе"></title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/code/Global_styles.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="/code/Header_and_Footer/styles.css" />

    <script>
      localStorage.setItem("amount_of_pages", 0);

          <span id="total-price"></span>
        </div>
      </main>
      <footer id="footer" class="footer"></footer>
    </div>
    <script src="/code/preloader/preloader.js"></script>
    <script type="module" src="/code/Header_and_Footer/header.js"></script>
    <script type="module" src="/code/Header_and_Footer/footer.js"></script>
    <script type="module" src="cart.js"></script>
    <script

      src="/code/Header_and_Footer/language-switcher.js"
