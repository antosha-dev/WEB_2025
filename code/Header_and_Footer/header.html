      <div class="burger-menu">
        <img src="/Header_and_Footer/assets/burger-menu.svg" alt="burger-menu">
      </div>
      <div class="auth-buttons">
        <button class="restart-toggle">
          <img
            src="/Header_and_Footer/assets/restart-header.svg"
            alt="Restart"
          />
        </button>
        <div>
          <input type="checkbox" id="visibility" class="visibility-wrapper" />
          <label for="visibility" class="visibility-toggle">
            <img
              src="/Header_and_Footer/assets/visibility_off.png"
              alt="Visibility Off"
              class="visibility-off invert"
            />
            <img
              src="/Header_and_Footer/assets/visibility.png"
              alt="Visibility On"
              class="visibility-on invert"
            />
          </label>
        </div>
        <input id="language-toggle" type="checkbox" class="language-button" />
        <label for="language-toggle">
          <img
            src="/Header_and_Footer/assets/language.png"
            alt="language changer"
            class="language-toggle invert"
          />
          <span
            style="color: var(--black)"
            id="selected-language"
            data-i18n="header_selected_language"
            >en</span
          >
        </label>
        <input id="theme-toggle" type="checkbox" class="theme-button" />
        <label for="theme-toggle" class="theme-toggle">
          <img
            src="/Header_and_Footer/assets/theme.svg"
            alt="theme button"
            class="invert"
          />
        </label>
        <div id="no-user" class="no-user">
          <a
            href="/Log_in/index.html"
            class="login-button"
            data-i18n="header_login"
            >Log In</a
          >
          <a
            href="/Sign_up/index.html"
            class="signup-button"
            data-i18n="header_sign_up"
            >Sign Up</a
          >
        </div>
        <div id="with-user" class="with-user">
          <div class="shopping-section">
            <div class="shopping-item">
              <img
                src="/Header_and_Footer/assets/shopping_cart.png"
                class="shopping-icon invert"
                alt="shopping icon"
              />
              <a
                href="/Cart/index.html"
                class="shopping-text"
                data-i18n="header_cart"
                >Cart</a
              >
            </div>
            <span class="separator">|</span>
          </div>
          <a href="/Account/index.html" class="user-profile">
            <img
              id="user-avatar"
              src="/Header_and_Footer/assets/avatar.png"
              class="user-avatar"
              alt="User avatar"
            />
            <span id="username-span" class="user-name">UNSET</span>
          </a>
          <button
            id="log-out-button"
            class="signup-button"
            data-i18n="header_logout"
          >
            Log Out
          </button>
        </div>
      </div>
      <!-- Панель доступности -->
      <div id="accessibility-panel" class="accessibility-panel">
        <div class="accessibility-controls">
          <h3 data-i18n="accessibility.panelTitle">Accessibility Settings</h3>
          <div class="font-size-control">
            <label data-i18n="accessibility.fontSize">Font Size</label>
            <button
              data-font-size="small"
              data-i18n="accessibility.fontSizeSmall"
            >
              Small
            </button>
            <button
              data-font-size="medium"
              data-i18n="accessibility.fontSizeMedium"
            >
              Medium
            </button>
            <button
              data-font-size="large"
              data-i18n="accessibility.fontSizeLarge"
            >
              Large
            </button>
          </div>
          <div class="color-scheme-control">
            <label data-i18n="accessibility.colorScheme">Color Scheme</label>
            <button
              data-color-scheme="black-white"
              data-i18n="accessibility.colorSchemeBlackWhite"
            >
              Black on White
            </button>
            <button
              data-color-scheme="black-green"
              data-i18n="accessibility.colorSchemeBlackGreen"
            >
              Green on Black
            </button>
            <button
              data-color-scheme="white-black"
              data-i18n="accessibility.colorSchemeWhiteBlack"
            >
              White on Black
            </button>
            <button
              data-color-scheme="beige-brown"
              data-i18n="accessibility.colorSchemeBeigeBrown"
            >
              Brown on Beige
            </button>
            <button
              data-color-scheme="blue-lightblue"
              data-i18n="accessibility.colorSchemeBlueLightBlue"
            >
              Black on Light Blue
            </button>
          </div>
          <div class="images-control">
            <label data-i18n="accessibility.images">Images</label>
            <button data-images="on" data-i18n="accessibility.imagesOn">
              On
            </button>
            <button data-images="off" data-i18n="accessibility.imagesOff">
              Off
            </button>
          </div>
          <button class="apply-settings" data-i18n="accessibility.apply">
            Apply
          </button>
          <button class="close-settings" data-i18n="accessibility.close">
            Close
          </button>
        </div>
      </div>
    </header>
